# .github/workflows/publish.yml — manual dispatch only.
# Image builds moved to iowap-org/iowap-docker (Build Docker Images workflow).
# Kept as an escape hatch for emergency rebuilds from the source repo;
# NOT triggered on push anymore.
name: publish
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/iowap-org/iowap-flow:latest
            ghcr.io/iowap-org/iowap-flow:${{ github.sha }}