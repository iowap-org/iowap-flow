# .github/workflows/publish.yml — FROZEN Kontrakt (Plan Task 6, self-contained)
name: publish
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/iowap-org/iowap-flow:latest
            ghcr.io/iowap-org/iowap-flow:${{ github.sha }}